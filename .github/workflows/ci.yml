name: Build and Package

on:
  push:
    branches: [develop, master]
    tags: ["v*"]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify project
        run: mvn --batch-mode clean verify
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run JavaFX UI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum mvn --batch-mode -Dphase6.ui=true -Dtest=MainWindowSmokeTest test

  package-linux:
    name: Package Linux DEB
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build shaded JAR
        run: mvn --batch-mode -DskipTests package
      - name: Build app image and DEB
        shell: bash
        run: |
          mkdir -p target/package-input target/dist
          cp target/mathedu-1.0.0-shaded.jar target/package-input/
          jpackage --type app-image --name MathEdu --app-version 1.0.0 \
            --input target/package-input --main-jar mathedu-1.0.0-shaded.jar \
            --main-class com.mathedu.app.Launcher --dest target/dist
          jpackage --type deb --name MathEdu --app-version 1.0.0 \
            --input target/package-input --main-jar mathedu-1.0.0-shaded.jar \
            --main-class com.mathedu.app.Launcher --dest target/dist \
            --linux-menu-group Education --linux-shortcut
          test -x target/dist/MathEdu/bin/MathEdu
          test -f target/dist/MathEdu/lib/app/MathEdu.cfg
      - name: Launch packaged app image
        shell: bash
        run: |
          set +e
          xvfb-run --auto-servernum timeout 20s target/dist/MathEdu/bin/MathEdu
          status=$?
          if [[ $status -ne 124 ]]; then exit $status; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mathedu-linux-1.0.0
          path: target/dist/*
          if-no-files-found: error

  package-windows:
    name: Package Windows MSI
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install WiX Toolset
        run: choco install wixtoolset --yes --no-progress
      - name: Build shaded JAR
        run: mvn --batch-mode -DskipTests package
      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/package-input, target/dist | Out-Null
          Copy-Item target/mathedu-1.0.0-shaded.jar target/package-input/
          jpackage --type msi --name MathEdu --app-version 1.0.0 `
            --input target/package-input --main-jar mathedu-1.0.0-shaded.jar `
            --main-class com.mathedu.app.Launcher --dest target/dist `
            --win-menu --win-shortcut
          if (-not (Test-Path target/dist/MathEdu-1.0.0.msi)) { throw "MSI package missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: mathedu-windows-1.0.0
          path: target/dist/*
          if-no-files-found: error

  release:
    name: Publish stable release
    needs: [package-linux, package-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: MathEdu ${{ github.ref_name }}
          files: release-assets/**
